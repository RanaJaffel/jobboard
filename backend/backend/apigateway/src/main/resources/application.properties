spring.application.name=Api_gatway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Route CANDIDATURE avec Load Balancer
spring.cloud.gateway.server.webmvc.routes[0].id=CANDIDATURE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CANDIDATURE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/candidature/**

# Route CANDIDAT sans Load Balancer
spring.cloud.gateway.server.webmvc.routes[1].id=CANDIDAT
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/candidates/**

# Logs
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG